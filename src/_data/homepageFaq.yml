items:
  - question: "How do I know if I need therapy?"
    answer: "You don't need a crisis to qualify. If something has been sitting on you and talking to the people around you hasn't moved it, that's reason enough. The consult call exists partly so you can ask me this directly."
  - question: "Do you speak Farsi?"
    answer: "Yes — sessions are available in English or Farsi, whichever feels more natural for what we're talking about. Some people switch between the two in the same conversation, and that's fine too."
  - question: "What actually happens in a session?"
    answer: "We talk, but with more structure than a conversation with a friend. I'll ask questions, notice patterns out loud, and sometimes suggest something to try between sessions. You are never obligated to discuss something before you're ready."
  - question: "How long will this take?"
    answer: "Some people come for a few months around a specific difficulty. Others stay for years because the work keeps being useful. We'll revisit it regularly, and ending well is part of the work, not a failure of it."
  - question: "Is what I say confidential?"
    answer: "Yes, with the narrow legal exceptions I'm required to explain at the start: risk of serious harm to yourself or someone else, and suspected abuse of a child or vulnerable adult. I'll walk you through exactly what that means in our first session."
  - question: "My teenager doesn't want to come."
    answer: "That's normal and workable. I usually start with a parent call, then meet them once with no expectation of a second. Most of the time the reluctance is about control, so I hand them as much of it as I can."
  - question: "Is online therapy as effective as in-person?"
    answer: "For most of what I treat, yes — the research is reassuring. What matters most is consistency and having a private, quiet place to sit for the session."
  - question: "Do you offer in-person sessions?"
    answer: "Not currently — sessions are online only right now, for anyone physically located in Washington state. If that changes, it'll be reflected here."
  - question: "Do you work with clients outside Washington?"
    answer: "I'm licensed to practice in Washington, so sessions need to happen while you're physically located in the state. If you're elsewhere, I'm glad to help point you toward someone licensed where you are."
