items:
  - question: How do I know if I need therapy?
    answer: You don't need a crisis to qualify. If something has been sitting with you and talking to the people around you hasn't moved it, that's reason enough. Schedule a consultation to discuss further and determine how therapy can be helpful.
  - question: What actually happens in a session?
    answer: We spend 50 minutes in a structured conversation where I will ask questions, help you notice patterns, and suggest a variety of tools and skills to try between sessions. You are never obligated to discuss something before you're ready to do so.
  - question: How often do I attend therapy appointments?
    answer: As frequently as you like! Visits weekly or every other week are recommended upon starting services. But if needs change, we have the flexibility to increase or decrease the regularity. Appointments are available everyday of the week between 8am - 7pm PST.
  - question: How long do I stay in therapy?
    answer: Depending on your goals, we can focus on a short term, skills based path to reach them within a few months or explore more long term care that allows us to explore and dive deeper into topics for a few years. Know that we will visit your goals regularly to re-evaluate, and an end to therapy is part of the work.
  - question: Is what I say confidential?
    answer: Yes, with the narrow legal and ethical exceptions as a Washington state mandated reporter. I will walk you through exactly what that means in our first session.
  - question: What if the individual that I want to join therapy with me for a few sessions doesn't want to attend?
    answer: That's normal and workable. I usually start with a phone call to help build rapport, explore their reluctance, and explain how attending can be beneficial.  Most of the time the hesitation stems from a place of fear, is about control, or just requires a better understanding of the purpose and benefits of attending. If there continues to be pushback, we can further explore what that means for you moving forward.
  - question: Is online therapy as effective as in-person?
    answer: For what I treat, yes; the research is reassuring. In fact, removing the hurdles of travel and providing flexibility with scheduling can result in sticking with treatment for longer. What matters most is consistency and having a private, distraction free environment to be able to participate in the session.
  - question: Do you offer phone sessions?
    answer: Yes, therapy sessions over the phone are also available for clients physically located in Washington state. This allows for clients to have more autonomy if they desire, with added benefits of accessibility, comfort, and flexibility. Whether our session is via video or phone, you get to attend from the comfort of your couch, the convenience of your office, or the privacy of a parked car.
  - question: Do you offer in-person sessions?
    answer: Not currently. Sessions are online only right now for those who are physically located in Washington state. If that changes, it'll be reflected here.
  - question: Do you work with clients outside Washington?
    answer: I'm licensed to practice in Washington state, so sessions need to happen while you're physically located in the state. If you're traveling, please let me know so we can schedule accordingly upon your return.
  - question: What's the cancellation policy?
    answer: You have 24 hours to reach out to me via email or phone to inform me of a need to cancel. If you cancel your visit within 24 hours of your appointment or simply do not attend, you will be charged the full session fee.
